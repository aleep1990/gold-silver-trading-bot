name: Gold Silver Trading Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6          # ← نسخه ۶ که با Node.js 24 کار میکنه
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v6      # ← نسخه ۶ که با Node.js 24 کار میکنه
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Trading Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← این هم برای اطمینان اضافه شد
      run: python bot.py
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-logs
        path: |
          *.log
          .git/*.log
